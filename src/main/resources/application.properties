# Safe non-secret application settings. Configure the TMDB key in the Preferences UI.
app.tmdb.base-url=https://api.themoviedb.org

# AI Concierge (Ollama is the default provider)
app.ai.provider=OLLAMA
app.ai.logging.enabled=true
spring.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=qwen3:8b

# Set OPENAI_API_KEY in the runtime environment before selecting OPENAI.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=gpt-5

#uncomment to diagnose torrent downloads that never make progress
#logging.level.bt=DEBUG
