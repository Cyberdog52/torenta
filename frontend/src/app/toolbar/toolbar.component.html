<mat-toolbar>
  <span>Torenta</span>
  <div class="navigationButtonContainer">
    <button
      matIconButton
      [attr.aria-label]="themeLabel[themeService.current()]"
      [matTooltip]="themeLabel[themeService.current()]"
      (click)="themeService.cycle()"
    >
      <mat-icon>{{ themeIcon[themeService.current()] }}</mat-icon>
    </button>
    <nav aria-label="Main">
      <button
        matButton="elevated"
        routerLink="/search"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>movie</mat-icon>Search
      </button>
      <button
        matButton="elevated"
        routerLink="/recommendations"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>recommend</mat-icon>Recommendations
      </button>
      <button
        matButton="elevated"
        routerLink="/downloads"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>archive</mat-icon>Downloads
      </button>
      <button
        matButton="elevated"
        routerLink="/preferences"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon>settings</mat-icon>Preferences
      </button>
    </nav>
  </div>
</mat-toolbar>
