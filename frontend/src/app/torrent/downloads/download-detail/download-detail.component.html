<div class="download-detail {{ stateClass() }}">
  <div class="backdrop">
    <img [src]="backgroundImage()" alt="" loading="lazy" />
  </div>
  <div class="foreground">
    <div class="header-row">
      <p class="title">{{ title() }}</p>
      <span class="status-chip">
        <mat-icon>{{ status().icon }}</mat-icon>
        {{ status().label }}
      </span>
    </div>
    <p class="meta-line"><mat-icon>link</mat-icon>{{ peers() }}</p>
    @if (isRunning()) {
      <p class="meta-line"><mat-icon>network_check</mat-icon>{{ speed() }}</p>
      <p class="meta-line"><mat-icon>timelapse</mat-icon>{{ estimatedTimeFinished() }}</p>
    }
    <div class="progress">
      <div
        class="progress-track"
        role="progressbar"
        [attr.aria-valuenow]="progressPercent()"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div class="progress-fill" [style.width.%]="progressPercent()"></div>
      </div>
      @if (isRunning()) {
        <span>{{ progressString() }}</span>
      } @else {
        <mat-icon class="progress-icon">{{ status().icon }}</mat-icon>
      }
    </div>
  </div>
</div>
