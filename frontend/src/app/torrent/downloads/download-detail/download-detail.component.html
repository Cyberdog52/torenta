<div class="download-detail">
  <div class="backdrop">
    <img [src]="backgroundImage()" alt="" loading="lazy" />
  </div>
  <div class="foreground">
    <p class="title">{{ title() }}</p>
    <p class="meta-line"><mat-icon>link</mat-icon>{{ peers() }}</p>
    <p class="meta-line"><mat-icon>network_check</mat-icon>{{ speed() }}</p>
    <p class="meta-line"><mat-icon>timelapse</mat-icon>{{ estimatedTimeFinished() }}</p>
    <div class="progress">
      <mat-progress-bar mode="determinate" [value]="downloadDto().progress * 100" />
      @if (isRunning()) {
        <span>{{ progressString() }}</span>
      } @else {
        <mat-icon>done_outline</mat-icon>
      }
    </div>
  </div>
</div>
