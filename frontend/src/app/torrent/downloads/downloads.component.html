<mat-card>
  <mat-card-header>
    <mat-card-title>Downloads</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @for (downloadDto of downloads(); track downloadDto.id) {
      <app-download-detail [downloadDto]="downloadDto" />
    } @empty {
      <p class="empty">Downloads will be shown here</p>
    }
  </mat-card-content>
</mat-card>
