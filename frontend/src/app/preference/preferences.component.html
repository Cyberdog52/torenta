<mat-card>
  <mat-card-header>
    <mat-card-title>Preferences</mat-card-title>
  </mat-card-header>
  @if (userPreferences(); as preferences) {
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Root folder for downloads</mat-label>
        <input
          matInput
          name="downloadFolder"
          type="text"
          [ngModel]="preferences.downloadDirectoryPath"
          (ngModelChange)="setDownloadDirectoryPath($event)"
        />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>TMDB service key</mat-label>
        <input
          matInput
          name="tmdbServiceKey"
          type="text"
          [ngModel]="preferences.tmdbServiceKey"
          (ngModelChange)="setTmdbServiceKey($event)"
        />
        @if (!preferences.tmdbServiceKey) {
          <mat-hint>get your own key at https://www.themoviedb.org/documentation/api</mat-hint>
        }
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button matButton="elevated" (click)="savePreferences()">Save</button>
    </mat-card-actions>
  } @else {
    <mat-card-content>
      <p>Preferences could not be loaded</p>
    </mat-card-content>
  }
</mat-card>
