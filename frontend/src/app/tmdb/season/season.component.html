<div class="season">
  <div class="meta-line">
    <mat-icon aria-hidden="true">queue_play_next</mat-icon>
    <span>{{ tmdbSeasonDto().name }}</span>
    <app-overview-popover [title]="tmdbSeasonDto().name" [overview]="tmdbSeasonDto().overview" />
    <mat-icon aria-hidden="true">date_range</mat-icon>
    <span class="visually-hidden">Air date:</span>{{ tmdbSeasonDto().air_date }}
  </div>
  <div class="episode-buttons">
    @for (tmdbEpisodeDto of episodes(); track tmdbEpisodeDto.id) {
      <button
        matButton="elevated"
        class="chip-button"
        [attr.aria-pressed]="isSelected(tmdbEpisodeDto)"
        (click)="showEpisode.set(tmdbEpisodeDto)"
      >
        {{ episodeButtonTitle(tmdbEpisodeDto) }}
        @if (episodeIcon(tmdbEpisodeDto); as icon) {
          <ng-container>
            <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
            <span class="visually-hidden">{{ episodeIconLabel(tmdbEpisodeDto) }}</span>
          </ng-container>
        }
      </button>
    }
  </div>
  @if (showEpisode(); as episode) {
    <app-episode
      [tmdbEpisodeDto]="episode"
      [seriesDetail]="seriesDetail()"
      [downloadStatus]="downloadStatus(episode)"
    />
  }
</div>
