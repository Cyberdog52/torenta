<div class="episode">
  <p>
    <mat-icon>queue_play_next</mat-icon> {{ tmdbEpisodeDto().name }} •
    <mat-icon>date_range</mat-icon>{{ tmdbEpisodeDto().air_date }}
  </p>
  @if (downloadText(); as downloadText) {
    <p><mat-icon>archive</mat-icon> {{ downloadText }}</p>
  }
  <p class="overview">{{ tmdbEpisodeDto().overview }}</p>
  <app-torrent-suggestions [tmdbEpisodeDto]="tmdbEpisodeDto()" [seriesDetail]="seriesDetail()" />
</div>
