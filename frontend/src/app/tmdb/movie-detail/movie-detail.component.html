@if (isLoading()) {
  <div class="loading">
    <mat-progress-spinner mode="indeterminate" diameter="32" aria-label="Loading movie details" />
  </div>
} @else if (movieDetail(); as movieDetail) {
  <div class="movie-detail">
    <div class="foreground">
      <app-torrent-suggestions [movieDetail]="movieDetail" />
    </div>
  </div>
}
